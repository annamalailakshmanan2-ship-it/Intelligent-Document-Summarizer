 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Summarizer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .opening-container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            width: 70%;
            max-width: 700px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            font-size: 32px;
            color: #222;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 35px;
        }

        a {
            display: inline-block;
            padding: 14px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        a:hover {
            opacity: 0.9;
        }
    </style>

</head>
<body>

    <div class="opening-container">
        <h1>Intelligent Document Summarizer</h1>
        <p>
            Summarize long documents instantly using smart text analysis.
            Simple, fast, and easy to use.
        </p>
        <a href="index.html">Get Started</a>
    </div>

</body>
</html>
